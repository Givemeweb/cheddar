name: Release SatSale APK

on:
  push:
    tags:
      - 'satsale-v*'

permissions:
  contents: write

concurrency:
  group: satsale-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APP_VARIANT: satsale
  EXPO_NO_TELEMETRY: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: satsale-release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate release tag
        run: |
          node scripts/releaseVersion.js --self-test
          node scripts/releaseVersion.js "$GITHUB_REF_NAME" --github-env

      - name: Install dependencies
        run: npm ci

      - name: Validate release secrets
        env:
          API_URL: ${{ vars.EXPO_PUBLIC_SATSALE_API_URL || secrets.EXPO_PUBLIC_SATSALE_API_URL }}
          KEYSTORE_B64: ${{ secrets.SATSALE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SATSALE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SATSALE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SATSALE_KEY_PASSWORD }}
          CERT_SHA: ${{ secrets.SATSALE_CERT_SHA256 }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        run: |
          missing=""
          for name in API_URL KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA SIGN_WITH; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release configuration:$missing"
            exit 1
          fi
          echo "All release secrets and variables are set."

      - name: Write SatSale API URL
        env:
          SATSALE_API_URL: ${{ vars.EXPO_PUBLIC_SATSALE_API_URL || secrets.EXPO_PUBLIC_SATSALE_API_URL }}
        run: |
          case "$SATSALE_API_URL" in
            https://localhost*|https://127.*|https://0.0.0.0*|https://\[::1\]*)
              echo "::error::EXPO_PUBLIC_SATSALE_API_URL must not point at a local host."
              exit 1
              ;;
            https://*)
              ;;
            *)
              echo "::error::EXPO_PUBLIC_SATSALE_API_URL must be a non-local https:// endpoint."
              exit 1
              ;;
          esac
          printf 'EXPO_PUBLIC_SATSALE_API_URL=%s\n' "$SATSALE_API_URL" > .env

      - name: Build variant guardrail
        timeout-minutes: 20
        run: npm run guardrail -- --gradle

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Add swap for the universal build
        # A 4-ABI React Native release build exceeds the runner's memory.
        # The image already has an active /swapfile, and fallocate on it
        # fails with "Text file busy", so use a separate path.
        run: |
          if swapon --show | grep -q '^/swapfile2'; then
            echo "Extra swap already active."
          else
            sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          fi
          free -h

      - name: Write release keystore
        env:
          SATSALE_KEYSTORE_BASE64: ${{ secrets.SATSALE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SATSALE_KEYSTORE_BASE64" ]; then
            echo "::error::SATSALE_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$SATSALE_KEYSTORE_BASE64" | base64 --decode > android/app/satsale-release.jks
          chmod 600 android/app/satsale-release.jks

      - name: Build signed universal APK
        working-directory: android
        env:
          SATSALE_KEYSTORE_FILE: ${{ github.workspace }}/android/app/satsale-release.jks
          SATSALE_KEYSTORE_PASSWORD: ${{ secrets.SATSALE_KEYSTORE_PASSWORD }}
          SATSALE_KEY_ALIAS: ${{ secrets.SATSALE_KEY_ALIAS }}
          SATSALE_KEY_PASSWORD: ${{ secrets.SATSALE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -x lint -x lintVitalRelease \
            -I ../scripts/android-release-signing.gradle

      - name: Verify certificate, version, URL, and ABIs
        env:
          SATSALE_CERT_SHA256: ${{ secrets.SATSALE_CERT_SHA256 }}
          SATSALE_API_URL: ${{ vars.EXPO_PUBLIC_SATSALE_API_URL || secrets.EXPO_PUBLIC_SATSALE_API_URL }}
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME must be set to locate apksigner and aapt}"

          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"

          if [ -z "$SATSALE_CERT_SHA256" ]; then
            echo "::error::SATSALE_CERT_SHA256 is not set; cannot prove this APK uses the linked certificate."
            exit 1
          fi

          if [ -z "$APP_VERSION" ] || [ -z "$APP_VERSION_CODE" ]; then
            echo "::error::APP_VERSION/APP_VERSION_CODE were not exported by releaseVersion.js."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt

          CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -1 | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$SATSALE_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')

          if [ -z "$CERT" ] || [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::APK certificate $CERT does not match SATSALE_CERT_SHA256 $EXPECTED."
            exit 1
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)

          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under $ANDROID_HOME/build-tools."
            exit 1
          fi

          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"

          if ! printf '%s' "$BADGING" | grep -qF "name='com.cheddar.app.bee'"; then
            echo "::error::APK package is not com.cheddar.app.bee."
            exit 1
          fi

          if ! printf '%s' "$BADGING" | grep -qF "versionCode='${APP_VERSION_CODE}'"; then
            echo "::error::APK versionCode is not ${APP_VERSION_CODE}."
            exit 1
          fi

          if ! printf '%s' "$BADGING" | grep -qF "versionName='${APP_VERSION}'"; then
            echo "::error::APK versionName is not ${APP_VERSION}."
            exit 1
          fi

          if [ -z "$SATSALE_API_URL" ]; then
            echo "::error::EXPO_PUBLIC_SATSALE_API_URL is not set."
            exit 1
          fi

          if ! unzip -Z1 "$APK" | grep -qx 'assets/index.android.bundle'; then
            echo "::error::APK does not contain assets/index.android.bundle; cannot verify the bundled API URL."
            exit 1
          fi

          BUNDLE=$(mktemp)
          unzip -p "$APK" assets/index.android.bundle > "$BUNDLE"

          if ! grep -qF "$SATSALE_API_URL" "$BUNDLE"; then
            echo "::error::APK bundle does not contain EXPO_PUBLIC_SATSALE_API_URL; .env was not bundled."
            rm -f "$BUNDLE"
            exit 1
          fi
          rm -f "$BUNDLE"

          ABIS=$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          echo "Native ABIs: $ABIS"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! printf '%s' "$ABIS" | grep -qw "$abi"; then
              echo "::error::Universal APK is missing $abi."
              exit 1
            fi
          done

      - name: Stage release files
        run: |
          mkdir -p dist
          APK="cheddar-satsale-${APP_VERSION}-universal.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          cat "dist/$APK.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_NAME="cheddar-satsale-${APP_VERSION}-universal.apk"

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')

            if printf '%s\n' "$ASSETS" | grep -qx "$APK_NAME" &&
               printf '%s\n' "$ASSETS" | grep -qx "$APK_NAME.sha256"; then
              echo "Release assets already present; leaving them unchanged."
            else
              # Repair a partial release, but never replace a complete APK and
              # checksum pair that Zapstore may already have recorded.
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Cheddar SatSale ${APP_VERSION}" \
              --generate-notes
          fi

      - name: Install zsp
        run: |
          ZSP_VERSION=2.0.0
          ZSP_SHA256=5483806beafde1b5deaa16f5efbead35a211b7d6015752f86d099e0faecc4a66
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL \
            -o "$RUNNER_TEMP/bin/zsp" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          printf '%s  %s\n' "$ZSP_SHA256" "$RUNNER_TEMP/bin/zsp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/zsp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "::error::ZAPSTORE_SIGN_WITH is not set."
            exit 1
          fi

          set +e
          STDOUT=$(zsp publish -q --json 2>/tmp/zsp.err)
          STATUS=$?
          set -e
          printf '%s\n' "$STDOUT"
          cat /tmp/zsp.err >&2

          if [ "$STATUS" -ne 0 ]; then
            # zsp writes failure JSON to stderr, success JSON to stdout.
            CODE=$(jq -r '.error.code // empty' /tmp/zsp.err 2>/dev/null || true)
            if [ "$CODE" = "no_new_apk" ] || [ "$CODE" = "release_already_published" ]; then
              echo "Zapstore already has this release."
            else
              exit "$STATUS"
            fi
          fi
