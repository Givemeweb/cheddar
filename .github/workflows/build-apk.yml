name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write RevenueCat key
        env:
          RC_ANDROID: ${{ secrets.EXPO_PUBLIC_RC_API_KEY_ANDROID }}
        run: |
          if [ -n "$RC_ANDROID" ]; then
            printf 'EXPO_PUBLIC_RC_API_KEY_ANDROID=%s\n' "$RC_ANDROID" > .env
            echo "RevenueCat Android key loaded."
          else
            echo "::warning::EXPO_PUBLIC_RC_API_KEY_ANDROID is not set; premium will be disabled in this build."
          fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # GitHub-hosted runners have ~7 GB RAM. A 4-ABI RN release build with
        # Hermes/Reanimated/Worklets C++ compilation OOMs and kills the runner
        # agent (job fails with no logs). Build arm64 only and cap parallelism.
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lint -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
